<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handbuch-Legal-DOM-Test</title>
  <style>
    body { margin: 16px; font: 14px system-ui, sans-serif; }
    iframe { display: block; width: 500px; max-width: 100%; height: 720px; border: 1px solid #999; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Handbuch-Legal-DOM-Test</h1>
  <iframe id="manualTestFrame" title="Handbuch-Testseite"></iframe>
  <pre id="manualTestResult">Test läuft ...</pre>
  <script>
    (async function () {
      'use strict';

      const languages = ['de', 'en', 'fr', 'es', 'pt'];
      const frame = document.getElementById('manualTestFrame');
      const output = document.getElementById('manualTestResult');
      const results = [];
      const originalOpen = window.open;

      function waitForFrame() {
        return new Promise(function (resolve, reject) {
          const timer = window.setTimeout(function () {
            reject(new Error('Ladezeit überschritten'));
          }, 5000);
          frame.onload = function () {
            window.clearTimeout(timer);
            resolve();
          };
        });
      }

      try {
        window.open = function () {
          return {
            closed: false,
            opener: null,
            location: { assign: function () {} }
          };
        };

        for (const language of languages) {
          const loaded = waitForFrame();
          frame.src = '../offline/' + language + '.html';
          await loaded;

          const childWindow = frame.contentWindow;
          const childDocument = frame.contentDocument;
          childDocument.documentElement.style.scrollBehavior = 'auto';
          childWindow.scrollTo(0, childDocument.documentElement.scrollHeight);

          const links = Array.from(childDocument.querySelectorAll('.manual-legal-footer a'));
          const linkResults = [];

          for (const link of links) {
            const rect = link.getBoundingClientRect();
            const style = childWindow.getComputedStyle(link);
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const topElement = childDocument.elementFromPoint(centerX, centerY);
            let handlerExecuted = false;

            childWindow.fetch = function () {
              return new Promise(function () {});
            };
            childDocument.addEventListener('click', function probe(event) {
              if (event.target.closest && event.target.closest('a') === link) {
                handlerExecuted = event.defaultPrevented;
              }
            }, { once: true });
            link.dispatchEvent(new childWindow.MouseEvent('click', {
              bubbles: true,
              cancelable: true
            }));

            linkResults.push({
              text: link.textContent.trim(),
              present: true,
              visible: rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden',
              positiveBoundingBox: rect.width > 0 && rect.height > 0,
              pointerEvents: style.pointerEvents,
              topElementIsLink: topElement === link || link.contains(topElement),
              handlerExecuted: handlerExecuted
            });
          }

          results.push({ language: language, links: linkResults });
        }
      } catch (error) {
        results.push({ error: error.message || String(error) });
      } finally {
        window.open = originalOpen;
      }

      const passed = results.length === languages.length && results.every(function (page) {
        return page.links && page.links.length === 2 && page.links.every(function (link) {
          return link.present && link.visible && link.positiveBoundingBox &&
            link.pointerEvents !== 'none' && link.topElementIsLink && link.handlerExecuted;
        });
      });

      document.body.dataset.testResult = passed ? 'passed' : 'failed';
      output.textContent = (passed ? 'BESTANDEN\n' : 'FEHLGESCHLAGEN\n') +
        JSON.stringify(results, null, 2);
    }());
  </script>
</body>
</html>
